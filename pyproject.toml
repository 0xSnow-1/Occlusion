[project]
name = "occlusion"
version = "0.1.0"
description = "Citation-grounded dental patient-FAQ RAG agent (MVP) — hybrid retrieval, RRF fusion, fail-closed guardrails, Ragas eval harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.30",
    "fastembed>=0.8.0",
    "langchain>=1.3.9",
    "langchain-aws>=1.5.1",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.7",
    "langgraph>=1.2.5",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.2",
    "qdrant-client[fastembed]>=1.18.0",
    "ragas==0.4.2",
    "streamlit>=1.38.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
